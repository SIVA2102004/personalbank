services:
  - type: web
    name: moneyflow-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        value: sqlite:///./moneyflow.db
      - key: JWT_SECRET
        value: super_secret_jwt_key_for_moneyflow_fintech_production_key_98374